<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skibb Holdings</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Skibb Holdings is a real estate platform focused on building and operating housing in supply-constrained Southern California markets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
<style>
  /* Layout: one quiet screen. Date/time bar on top, the extruded "skibb" mark at center,
     contact beneath, and the Lough Hyne drawing washed into the paper along the bottom. */
  :root {
    --paper: #F3F2EE;          /* Singer Dolan's ground */
    --green: #004225;          /* British racing green */
    --green-muted: rgba(0, 66, 37, 0.62);
    --green-faint: rgba(0, 66, 37, 0.38);
    --rule: rgba(0, 66, 37, 0.22);
    --f-ui: "Jost", "Futura", "Avenir Next", "Century Gothic", system-ui, sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--green);
    font-family: var(--f-ui);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }

  .landscape {
    position: fixed;
    left: -6vw; right: -6vw; bottom: 0;
    height: clamp(240px, 38vw, 52vh);
    background: url("lough-hyne.webp") center 70% / cover no-repeat;
    opacity: 0.62;
    filter: saturate(0.68);
    mix-blend-mode: multiply;
    -webkit-mask-image: radial-gradient(ellipse 70% 100% at 50% 100%, #000 0%, #000 34%, rgba(0,0,0,.7) 56%, rgba(0,0,0,.25) 74%, transparent 90%);
    mask-image: radial-gradient(ellipse 70% 100% at 50% 100%, #000 0%, #000 34%, rgba(0,0,0,.7) 56%, rgba(0,0,0,.25) 74%, transparent 90%);
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100%;
    box-sizing: border-box;
    display: grid;
    grid-template-rows: 1fr auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 22px;
  }
  @media (min-width: 720px) {
    .page { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); padding-block: 28px; }
  }

  .bar {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--green-muted);
    font-variant-numeric: tabular-nums;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding-block: 32px 24vh;
    text-align: center;
  }

  .mark {
    margin: 0;
    width: min(340px, 68vw);
    max-width: 100%;
  }
  .mark svg { display: block; width: 100%; height: auto; }

  .contact {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  .statement {
    margin: 0;
    max-width: 46ch;
    font-size: 14px;
    font-weight: 300;
    line-height: 1.85;
    letter-spacing: 0.03em;
    color: var(--green-muted);
    text-wrap: balance;
    text-shadow: 0 0 8px var(--paper), 0 0 16px var(--paper);
  }
  .inquiries {
    margin: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    gap: 6px 14px;
  }
  .inquiries span {
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--green-faint);
    text-shadow: 0 0 8px var(--paper), 0 0 16px var(--paper);
  }
  .email {
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.04em;
    color: var(--green);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
    transition: border-color .2s;
    text-shadow: 0 0 8px var(--paper), 0 0 16px var(--paper);
  }
  .email:hover, .email:focus-visible { border-bottom-color: var(--green-faint); outline: none; }
  .rule { width: 36px; height: 1px; background: var(--rule); }

  .foot {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--green-muted);
    text-shadow: 0 0 6px var(--paper), 0 0 12px var(--paper);
  }

  @media (max-width: 480px) {
    .bar { font-size: 10px; letter-spacing: 0.14em; }
    .stage { gap: 22px; padding-block: 24px 16vh; }
    .landscape { left: -20vw; right: -20vw; height: 46vh; background-position: 58% 70%; opacity: 0.66; }
  }
</style>

</head>
